# Serves the built web app and reverse-proxies the API + sync WebSocket to the
# server container, so the whole app lives behind a single origin (which is what
# the production web build expects).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Collaborative sync WebSocket.
  location /sync {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1d;
  }

  # API and public share links.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;            # let SSE build events stream through
  }
  location /s/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA: everything else falls back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
