name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint:deps
      - run: pnpm test
      - run: pnpm test:scripts

  e2e:
    name: End-to-end (functional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @makedown/web exec playwright install --with-deps chromium

      # Run the functional e2e only. The visual-regression specs
      # (workbench.visual.spec.ts) use platform-specific baselines committed for
      # chromium-win32, so they are intentionally excluded on Linux CI.
      - run: pnpm --filter @makedown/web exec playwright test workbench.spec.ts
