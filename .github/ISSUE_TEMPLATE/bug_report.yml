name: Bug report
description: Report a problem with Makedown
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. For **security vulnerabilities**,
        do not use this form — see [SECURITY.md](../blob/master/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally a minimal `build.md` (or commands) that reproduces it.
      placeholder: |
        1. `md build ...`
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / engine
        - Provider router / models
        - Import (MarkItDown)
        - Collaborative app (server/web)
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version (`node -v`), Makedown version, and how you installed it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant CLI output or server logs. Redact any secrets.
      render: shell
